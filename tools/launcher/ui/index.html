<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://branding.bg3rtx.local file:; font-src 'self' https://fonts.bg3rtx.local file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>BG3RTX</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
<body><div class="window" aria-label="BG3RTX settings">
<div id="titlebar" class="titlebar" aria-hidden="true" hidden><img class="emblem" alt=""><span class="app-name">BG3RTX</span><span id="hero-version" class="app-version"></span><span class="caption-buttons"><i class="caption-min"></i><i class="caption-max"></i><i class="caption-close"></i></span></div>
<header><div class="preset-group"><span class="label" id="preset-label">Preset</span><div id="presets" class="presets" role="group" aria-labelledby="preset-label"></div></div><dl class="facts"><div><dt>GPU</dt><dd id="hero-gpu">Checking graphics…</dd></div><div><dt class="visually-hidden">Mod files</dt><dd id="hero-status"></dd></div></dl></header>
<nav id="navigation" aria-label="Settings sections"></nav>
<main id="main" tabindex="-1"><div id="warnings"></div><div id="section-content"></div></main>
<footer><div class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><div><div id="restart-banner" class="restart-banner" hidden></div><span id="status">Loading settings…</span></div></div><div class="spacer"></div><button id="discard" class="btn">Discard changes</button><button id="save" class="btn">Save</button><button id="play" class="btn play" disabled>Play</button></footer>
</div>
<dialog id="confirmation" aria-labelledby="confirmation-title"><h2 id="confirmation-title">Review changes</h2><div id="confirmation-copy"></div><div class="dialog-actions"><button class="btn" id="cancel-preview">Cancel</button><button class="btn primary" id="confirm-preview">Apply changes</button></div></dialog>
<dialog id="report-dialog" aria-labelledby="report-title"><h2 id="report-title">Report a problem</h2><p id="privacy"></p><p id="logging-hint" class="help-copy" hidden></p><div id="report-request"><label for="issue">What happened? <span class="help-copy">(optional)</span></label><textarea id="issue" maxlength="4000" placeholder="Tell us what you were doing and what went wrong."></textarea><div class="contents"><label><input id="include-logs" type="checkbox" checked> Logs</label><label><input id="include-settings" type="checkbox" checked> Graphics settings</label><label><input id="include-system" type="checkbox" checked> Graphics hardware</label></div></div><p id="report-progress" role="status" aria-live="polite" hidden></p><div id="report-preview"></div><div class="dialog-actions"><button class="btn" id="cancel-report" hidden>Cancel</button><button class="btn" id="close-report">Close</button><button class="btn primary" id="prepare-report">Preview files</button><button class="btn primary" id="export-report" hidden>Save report…</button></div></dialog>
</body></html>
