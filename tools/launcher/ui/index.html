<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://branding.bg3rtx.local file:; font-src 'self' https://fonts.bg3rtx.local file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>BG3RTX Launcher</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
<body><div class="window" aria-label="BG3RTX settings">
<i class="window-corner tl" aria-hidden="true"></i><i class="window-corner tr" aria-hidden="true"></i><i class="window-corner bl" aria-hidden="true"></i><i class="window-corner br" aria-hidden="true"></i>
<header><div class="brand"><img class="emblem" alt=""><div><h1>BG3RTX</h1><small>Ray-traced lighting &middot; fan mod</small></div></div><div class="spacer"></div><div id="presets" class="presets" role="group" aria-label="Preset"></div><div class="gpu"><div class="dot"></div><div><b id="gpu-name">Checking graphics</b><span id="gpu-info">Please wait</span></div></div></header>
<nav id="navigation" aria-label="Settings sections"></nav>
<main id="main" tabindex="-1"><section class="hero" aria-labelledby="hero-title"><div class="hero-copy"><h2 id="hero-title">BG3RTX <span id="hero-version"></span></h2><dl><dt>Preset</dt><dd id="hero-preset"></dd><dt>GPU / VRAM</dt><dd id="hero-gpu"></dd><dt>Mod status</dt><dd id="hero-status"></dd></dl></div></section><div class="section-title">Your setup</div><div id="summary" class="summary"></div><div id="warnings"></div><div id="section-content"></div></main>
<footer><div class="status" role="status" aria-live="polite"><div class="dot"></div><div><div id="restart-banner" class="restart-banner" hidden></div><span id="status">Loading settings...</span></div></div><div class="spacer"></div><button id="report" class="btn ghost">Report a problem</button><button id="discard" class="btn">Discard</button><button id="save" class="btn primary">Save</button><button id="play" class="btn play" disabled>Play</button></footer>
</div>
<dialog id="confirmation" aria-labelledby="confirmation-title"><h2 id="confirmation-title">Review changes</h2><div id="confirmation-copy"></div><div class="dialog-actions"><button class="btn" id="cancel-preview">Cancel</button><button class="btn primary" id="confirm-preview">Apply changes</button></div></dialog>
<dialog id="report-dialog" aria-labelledby="report-title"><h2 id="report-title">Report a problem</h2><p id="privacy"></p><div id="report-request"><label for="issue">What happened? <span class="help-copy">(optional)</span></label><textarea id="issue" maxlength="4000" placeholder="Tell us what you were doing and what went wrong."></textarea><div class="contents"><label><input id="include-logs" type="checkbox" checked> Logs</label><label><input id="include-settings" type="checkbox" checked> Graphics settings</label><label><input id="include-system" type="checkbox" checked> Graphics hardware</label></div></div><p id="report-progress" role="status" aria-live="polite" hidden></p><div id="report-preview"></div><div class="dialog-actions"><button class="btn" id="cancel-report" hidden>Cancel collection</button><button class="btn" id="close-report">Close</button><button class="btn primary" id="prepare-report">Preview contents</button><button class="btn primary" id="export-report" hidden>Create package...</button></div></dialog>
</body></html>
