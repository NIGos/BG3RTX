<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://branding.bg3rtx.local file:; font-src 'self' https://fonts.bg3rtx.local file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>BG3RTX</title><link rel="stylesheet" href="app.css"><script src="app.js" defer></script></head>
<body><div class="window" aria-label="BG3RTX settings">
<div id="titlebar" class="titlebar" aria-hidden="true" hidden><img class="emblem" alt=""><span class="app-name">BG3RTX</span><span class="caption-buttons"><i class="caption-min"></i><i class="caption-max"></i><i class="caption-close"></i></span></div>
<aside class="side"><div class="brand"><img class="emblem" alt=""><span>BG3RTX</span></div>
<nav id="navigation" aria-label="Sections"></nav>
<div class="side-foot"><button id="play" class="btn play" disabled>Play</button><p id="play-note" class="side-note"></p><p id="hero-version" class="side-note"></p></div></aside>
<div class="main-col">
<header id="header"><div class="page-head"><h1 id="page-title"></h1><p id="page-lead"></p></div><div class="preset-block"><div class="preset-group"><span class="label" id="preset-label">Preset</span><div id="presets" class="presets seg" role="group" aria-labelledby="preset-label"></div></div><p id="preset-note"></p></div></header>
<div id="warnings"></div>
<div class="body" id="body-grid"><main id="main" tabindex="-1"><div id="section-content"></div></main><aside id="detail" aria-label="Details of the selected setting"></aside></div>
<footer id="changes" class="idle"><div class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status">Loading settings…</span></div><button id="undo" class="btn small" hidden>Undo</button><button id="dismiss" class="btn small" hidden>Dismiss</button></footer>
</div></div>
<dialog id="report-dialog" aria-labelledby="report-title"><h2 id="report-title">Report a problem</h2><p id="privacy"></p><p id="logging-hint" class="help-copy" hidden></p><div id="report-request"><label for="issue">What happened? <span class="help-copy">(optional)</span></label><textarea id="issue" maxlength="4000" placeholder="Tell us what you were doing and what went wrong."></textarea><div class="contents"><label><input id="include-logs" type="checkbox" checked> Logs</label><label><input id="include-settings" type="checkbox" checked> Graphics settings</label><label><input id="include-system" type="checkbox" checked> Graphics hardware</label></div><label class="save-option"><input id="include-save" type="checkbox"> Include my latest save (helps reproduce the problem; contains your character and progress)</label></div><p id="report-progress" role="status" aria-live="polite" hidden></p><div id="report-preview"></div><div class="dialog-actions"><button class="btn" id="cancel-report" hidden>Cancel</button><button class="btn" id="close-report">Close</button><button class="btn primary" id="prepare-report">Preview files</button><button class="btn primary" id="export-report" hidden>Save report…</button></div></dialog>
</body></html>
