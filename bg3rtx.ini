# M5.3 the traced water reflections composed into the image (core/water.cpp, docs/PLAN_M5_WATER.md
# M5.3): the audited water FS (common/water_fs_patch.h) stores its probe-term factors per pixel, and
# a pass at the end of each forward water pass replaces the FS's probe term with the traced
# reflection where the ray resolves on screen: C' = max(C + A L - B, 0) (A = opacity x fog x
# atmosphere x the FS's env BRDF, B = opacity x fog x atmosphere x k x its probe term); unresolved
# rays keep the probe. Rough water (above rf_mirror_rough) keeps the probe. Needs rt_water_reflections=1
# and shaderInt64 (sharc_device=1). Enabling needs a restart (the FS variants are created with the
# water pipelines); 0 is live (the game's pipeline is bound). rt_debug=25: the delta view. Logs
# "[water] compose / compose energy / compose GPU / compose variants". GUI: Experimental "Water
# reflections (composed)".
rt_water_compose=0
# Experimental (docs/PLAN_M5_WATER.md M5.4): ray-traced sun shadows on the water. The audited water FS
# light the water with sun visibility 1 (no cascade sample; the clouds stay in their sun colour), so the
# patched FS also stores its unshadowed sun term D (40-byte records) and the compose pass traces one ray
# towards the sun disc per water pixel with a sun term: C' = max(C - (1 - V) D, 0), only the visibility
# changes (lit or unknown rays keep C). Works alone or with rt_water_compose. Needs rt_water_reflections=1
# and shaderInt64 (sharc_device=1). Enabling needs a restart; 0 is live. rt_debug=26: the shadow view.
# Log "[water] shadows". GUI: Experimental "Water sun shadows".
rt_water_shadows=0
# Experimental (docs/PLAN_M5_WATER.md M5.4b): ray-traced local-light shadows on the water. The audited water
# FS shadow only the lights with a game shadow map (atlas); the patched FS also stores its point + spot
# lights' sum and its BRDF inputs (96-byte records), and the compose pass walks the same froxel list,
# recomputes each light's term, checks their sum against the FS's, and traces one ray per light the game
# leaves unshadowed: C' = max(C - F sum (1 - V_k) c_k, 0) (lit, unknown and shadow-mapped lights keep C).
# Works alone or with rt_water_compose / rt_water_shadows. Needs rt_water_reflections=1 and shaderInt64.
# Enabling needs a restart; 0 is live. rt_debug=27: the view. Log "[water] local shadows". GUI:
# Experimental "Water local-light shadows".
rt_water_ls_shadows=0
# Experimental (docs/PLAN_M5_WATER.md M5.5 step 1): ray-traced refraction on the water. The audited water FS
# see the bed through a screen-space sample of the pre-water colour copy at the pixel itself (no Snell
# bending); the patched FS also stores that sample and its weight 1 - a (104-byte records), and the compose
# pass traces one refracted ray (the FS's own normal, the index from its own F0: 1.326) and, where the hit
# is on screen and visible, reads the same copy there: C' = max(C + (1 - a) (Copy(hit) - Refr), 0). The
# water's opacity (the game's medium) is unchanged; hidden, off-screen and missed rays keep the game's
# sample. Works alone or with the other water keys. Needs rt_water_reflections=1 and shaderInt64.
# Enabling needs a restart; 0 is live. rt_debug=28: the view. Log "[water] refraction". GUI:
# Experimental "Water refraction".
rt_water_refraction=0
# Experimental (docs/PLAN_M5_WATER.md M5.4c): with rt_water_shadows, the game's own sun shadow on the water FS
# that sample it (PL_noCaustics_Shadows at the S3 camp, huge_PL_Shadow) is replaced by the traced sun ray.
# Their sun radiance carries the game's visibility Vg (its cascade shadow map) as a factor; the patched FS
# also stores the sun light that shadow removed and Vg (8 more bytes per record), and where the sun ray is
# lit the compose restores it (C + Dg), where it is occluded it removes the sun (R, as rt_water_shadows).
# V = Vg leaves C unchanged. Without this key those FS keep the game's shadow (rt_water_shadows skips them).
# Needs rt_water_shadows=1 at creation. Enabling needs a restart; 0 is live. rt_debug=26: restored = cyan.
# Log "[water] game shadow". GUI: Experimental "Water game shadow replaced".
rt_water_game_shadow=0
# Record buffer of the patched water FS (32 B per pixel, 40 B with rt_water_shadows; 160 MB covers 5.2 /
