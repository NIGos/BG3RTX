# BG3RTX runtime settings. Re-read automatically while the game runs.
#
# This file is the developer default layer. Layers on top of it, in order
# (docs/USER_SETTINGS.md, common/settings.h):
#   bg3rtx_user.ini  written by bin/BG3RTX.exe (the launcher); may contain
#                    preset=low|medium|high|ultra, which expands to the preset's
#                    keys, then its own keys override them
#   %BG3RTX_INI%     per-run overrides (scripts/auto-run.ps1 -Set ...)
# The keys below equal the High preset. A release package appends
# data/release.ini (developer keys off).

# Developer tools: 1 enables the Ctrl+Shift+F10 trace hotkey (0 in release).
dev=1

# 1 loads the hot-reloadable core (bin/bg3rtx_core.dll), 0 unloads it.
core=1

# Dump every SPIR-V module the game creates to captures/shaders/<hash>.spv.
# Read at instance creation and on change. 0 when the key is missing (release).
dump_shaders=1

# Compile BG3RTX's own shaders with debug info (for Nsight / RenderDoc).
shader_debug=0

# Flip to 1 (and back to 0) to log the core's pass census.
census_dump=0

# ---- Track A: DLSS Ray Reconstruction (layer/ngx.cpp) ----
# 1 replaces BG3's DLSS SR evaluate with DLSS Ray Reconstruction (guides from
# the G-buffer, shaders/rr_guides.hlsl); 0 leaves the game's SR alone.
# Switches live; the first frame after a switch resets the history.
rr=1
# RR render preset hint for every quality mode: 0 default, 4 D, 5 E.
rr_preset=0
# Debug: replace the upscaled frame with one RR guide (1 diffuse albedo,
# 2 specular albedo, 3 normals, 4 roughness, 5 raw RT0, 6 depth x20,
# 7 the guides' per-pixel N.V: grey, red where negative).
rr_show=0
# 1: correct guides (docs/TRACK_A_RR.md): world-space normals, per-pixel N.V
# for the specular albedo, and the unjittered WorldToView/ViewToClip matrices,
# all from the G-buffer pass's camera UBO (set 0 binding 2). 0: the old guides
# (view-space normals, constant N.V = rr_nov, no matrices). Switches live.
rr_guides_v2=1
# v1 only: constant N.V for the specular albedo guide; <= 0 uses |n.z|.
rr_nov=0.5
# 1 builds the guides at the end of the G-buffer pass (required: the G-buffer
# memory is reused before the DLSS evaluate); 0 builds them at the evaluate
# (debug only, reads garbage). rr_dump_gbuffer=1 adds RT0-RT2 as seen at the
# evaluate to the trace.
rr_guides_at=1
rr_dump_gbuffer=0
# 0 leaves _nvngx.dll unhooked entirely (read when it loads).
ngx_hook=1

# ---- Track C: screen-space GI (docs/TRACK_C_GI.md) ----
gi=1
gi_rays=4
# Rays per pixel when Ray Reconstruction denoises (full-res path; gi_rays is the
# half-res path without RR).
gi_rr_rays=1
gi_steps=16
gi_radius=0.15
gi_thickness=0.03
gi_strength=1.0
gi_ao=1.0
gi_history=0.1
# 1 GI only, 2 added term x4, 3 visibility, 4 projection check, 5 normals
gi_debug=0

# ---- Track D: geometry capture for hardware RT (docs/TRACK_D_RT.md) ----
# 1 enables VK_EXT_transform_feedback and patches vertex shaders (read at
# device creation: restart the game). Traced frames then write
# captures/<ts>/geo/ (scene.bin, report.json, coverage.png).
geo_capture=0
# G-buffer pass GPU time in the log; geo_xfb_always=1 captures every frame
# into device memory (cost probe only).
geo_timing=0
geo_xfb_always=0

# ---- Track D phase 2: hardware ray tracing on the game's device ----
# 1 enables VK_KHR_acceleration_structure + VK_KHR_ray_query (instance API
# raised to 1.2, transform feedback on): read at instance/device creation,
# restart the game. Every frame the G-buffer geometry is captured and a
# BLAS/TLAS built over it (rt_build=0 pauses that live).
rt=1
rt_build=1
# BLAS refit when the frame's draw sequence matches the last build; a full
# rebuild at least every rt_rebuild_frames. rt_fast_trace=1 builds for trace
# speed instead of build speed.
rt_refit=1
rt_rebuild_frames=60
# Static/dynamic BVH split (TRACK_D_RT.md 11): instanced static meshes get one
# object-space BLAS each, built once, compacted and cached; the TLAS holds one
# instance per draw instance with the game's own instance matrices; the rest is
# captured per frame with a BLAS per draw, refit while its triangle count holds.
# 0 is the old single soup BLAS (rebuilt whenever the drawn set changes). Live.
# With the split, rt_rebuild_frames paces the per-draw BLAS (staggered) and the TLAS
# refit (rt_tlas_refit=1: refit while the instance list holds).
rt_bvh_split=1
rt_tlas_refit=1
# Mesh cache: compaction (rt_mesh_compact), triangles of new meshes built per frame,
# memory budget (pool + BLAS, LRU beyond it) and the audits that recapture cached
# draws and compare (count per frame, interval per mesh; a failure evicts the mesh).
rt_mesh_compact=1
rt_mesh_new_tris=4000000
rt_mesh_budget_mb=2048
rt_mesh_audits=2
rt_mesh_audit_frames=600
rt_fast_trace=0
# Ray-traced sun shadows folded into the game's sun shadow mask (in place of
# the screen-space contact shadows, which stay the fallback). Needs rt=1.
rt_shadows=1
# Screen-space contact shadows, the sun-shadow detail when rt_shadows=0.
contact_shadows=1
rt_strength=1.0
# Secondary-ray origins for every ray-traced pass (sun, AO, GI, D-LS):
# 1 the exact TLAS surface under the pixel, pushed off along its geometric normal
# by Wachter & Binder's float-ULP offset (gi/rt_origin.hlsl; the depth buffer's
# normal where no triangle matches, 2 pixel footprints along the shading normal
# at the shadow terminator); 0 the old offset, rt_bias x camera distance along
# the shading normal. Live.
rt_origin=1
# rt_origin=0 only: offset along the normal (fraction of camera distance). Ray length.
rt_bias=0.002
# 1 traces the sun also for back-lit skin, thin-translucency (foliage) and hair
# pixels, whose transmission reads the sun mask (offset to the side the light comes
# from); 0 zeroes their mask (the old behaviour). Live.
rt_backlit=1
rt_tmax=300
# Soft sun shadows: half-angle of the sun's disc in radians, sampled with 1 ray
# per pixel (RR denoises). 0.00459 is the game's own sun (its specular uses a
# disc of sin = 0.0045900648, 0.263 deg half-angle); 0 = hard shadows.
rt_sun_radius=0.00459
# Ray-traced ambient visibility in place of the screen-space one (folded into
# the game's AO through the GI path, so it needs gi=1): rays per half-res pixel
# and their length in world units.
rt_ao=0
rt_ao_rays=2
rt_ao_radius=1.0
# 1 traced sun visibility, 2 game sun mask (red) vs traced (green), 3 primary-ray
# check of the TLAS against the depth buffer (green match, red in front,
# blue behind, magenta miss), 4 ambient visibility as folded into the AO.
# Written into the lit diffuse. 1-3 need rt_shadows=1.
rt_debug=0
# GPU counters for the debug views and the hybrid GI, logged as "rt stats"
# (costs ~2 ms; measurements only).
rt_stats=0

# ---- Track D phase 3 (docs/TRACK_D_RT.md section 7) ----
# 1 builds the scene from the depth prepass with UVs (XFB stride 24) and
# alpha-tests cutout draws in every ray query (table: shaders/rt/alpha_fs.txt,
# from scripts/alpha_table.py). Read at device creation: restart. Needs rt=1.
rt_alpha=1
# Live A/B switch: 0 makes the alpha-tested geometry opaque again.
rt_alpha_test=1
# Alpha-tested part of the RT capture buffer (rt_xfb_mb, 384 MB): rt_alpha_mb at
# first and as the minimum; rt_alpha_auto=1 then sizes it at 1.5x the previous
# frame's demand (grown at once, shrunk below a third), capped at rt_alpha_max_pct
# of the buffer and by the opaque triangles' own demand. A full region turns
# alpha-tested draws opaque: logged as "[geo] WARNING", as is any draw left out.
rt_alpha_auto=1
rt_alpha_max_pct=60
# Triangle strips and fans go into the RT scene too (exact size: non-indexed, or
# indexed without primitive restart). Indirect draws cannot be sized and are
# counted in the "[geo] RT capture" log line.
rt_strips=1
# 5 = primary-ray check with errors coloured by origin (needs rt_shadows=1).
# Hybrid GI: the GI trace uses ray queries against the TLAS (needs rt=1, gi=1;
# replaces the screen-space trace and rt_ao). Hits on screen take last frame's
# radiance; hidden/off-screen hits: 0 occlude only, 1 ignore, 2 occlude + mean
# on-screen radiance.
gi_rt=1
gi_rt_radius=1.0
gi_rt_depth_tol=0.03
gi_rt_fallback=0

# ---- D-LS: ray-traced shadows for BG3's local point/spot lights (TRACK_D_RT.md 9) ----
# 1 re-evaluates every point/spot light the tiled lighting applied (its own
# light list, froxels and BRDF) and adds c * (traced visibility - game shadow)
# into the lit diffuse/specular, so lights without a shadow map stop leaking
# through walls and floors. Needs rt=1. Live. About 0.35 ms in the foundry.
rt_local_shadows=1
# Lights that have a game shadow map: 0 keep the game's atlas (it also has
# off-screen casters), 1 replace it with the traced visibility, 2 min of both.
ls_shadowed=0
# Soft shadows: light sphere radius (world units), sampled 1 ray per light with
# RR (ls_soft=-1 follows rr; without a denoiser the ray goes to the centre).
ls_source_radius=0.05
ls_soft=-1
# Rays stop this far short of the light (its own lamp/sconce geometry).
ls_clear=0.2
# Unshadowed lights with a smaller range (world units) are left alone.
ls_min_radius=0
# 0 one ray per light and pixel; 1-2 rays per pixel to lights chosen by RIS.
ls_samples=0
ls_strength=1.0
# 1 lights per pixel (red unshadowed, green shadowed; 1.0 = 8), 2 light removed x4,
# 3 traced visibility, 4 validation |game - recomputed| x4 (zeroes AO and sun mask),
# 5 recomputed direct local light (same zeroing). ls_stats=1 logs "ls stats".
ls_debug=0
ls_stats=0
# ls_debug=7: the validation of ls_debug=4 with the sun kept (checks the sun
# recompute of rt/bg3_sun.hlsli used by ao_direct).

# ---- RT audit fixes (docs/AUDIT_RT.md) ----
# Material classes (RT2.a bits 0-2, RT3; docs/FRAME_MAP.md): D-LS evaluates each
# light with the class's own BRDF (skin with diffuse colour 1 and transmission,
# anisotropic, hair, cloth sheen; unlit pixels untouched), and the GI composite adds
# the bounce with the class's diffuse colour (none on unlit, white on skin). 0: all
# pixels as class 0 (the old behaviour). Live.
mat_classes=1
# AO on direct light. The game multiplies direct sun and local light by
# mix(1, AO, 0.5), and with the GI fold that AO is our 1-ray RT visibility.
# 1 (default) no AO on lights whose shadow is ray traced (D-LS lights, the sun with
#   rt_shadows): exact compensation in the D-LS pass, the sun recomputed
#   (rt/bg3_sun.hlsli); their RT shadow is the occlusion, no contact is darkened twice;
# 2 the game's own factor with its own SSAO on those lights (the original look);
# 0 leave it (direct light darkened by the noisy RT visibility, contacts twice).
# Needs rt_local_shadows=1 (the pass that does it). Live.
ao_direct=1

# ---- D-RF: ray-traced reflections (TRACK_D_RT.md 10) ----
# 1 traces one reflection ray per pixel and replaces the game's specular probe term
# (recomputed exactly from the lighting's own probes, DFG LUT and occlusion) by
# what the ray sees where its hit is on screen: b11 += w * (L_hit * EnvBRDF - probe).
# Misses and off-screen/hidden hits keep the game's probe. Needs rt=1 and gi=1
# (last frame's radiance). Live. About 0.33 ms in the foundry.
rt_reflections=1
# Reflections fade to the probe between 0.75x and 1x of this roughness. With RR,
# GGX VNDF samples (rf_rr=-1 follows rr; mirror below rf_mirror_rough); without
# RR (no denoiser) mirror rays only, up to rf_max_rough_norr.
rf_max_rough=0.6
rf_max_rough_norr=0.3
rf_mirror_rough=0.1
rf_rr=-1
# Ray length (world units), depth agreement of an on-screen hit, screen-edge fade (uv).
rf_tmax=100
rf_depth_tol=0.03
rf_edge=0.05
rf_strength=1.0
# 1 also applies the game's specular occlusion to traced hits (the ray already
# finds the occluder, so 0). Shading models (RT2.w & 7) that get reflections: bit mask.
rf_so=0
rf_models=3
# 1 tier per pixel (green on-screen hit, red hidden, orange off screen, blue miss,
# magenta below horizon, grey not traced), 2 specular change x4 (green added, red
# removed), 3 the game's probe term as recomputed, 4 the probe term after D-RF,
# 5 validation residual x4 (with rf_validate=1), 6 hit distance / 10.
# rf_stats=1 logs "rf stats"; rf_validate=1 (with rf_stats=1) runs the lighting
# with AO 1 and no sun and logs "rf validation" (game vs recomputed specular).
rf_debug=0
rf_stats=0
rf_validate=0
# RR gets the reflection rays' hit distance (DLSSD.SpecularHitDistance).
rr_spec_hit_distance=1

# DLSS Frame Generation through Streamline (docs/TRACK_B_FG.md).
# 0 = off (Streamline not loaded), 2 = 2x, 3 = 3x, 4 = 4x (multi frame, RTX 50).
# Streamline loads at instance creation, so switching between 0 and 2..4
# needs a restart; 2, 3 and 4 switch while the game runs.
fg=2
# NVIDIA Reflex: 0 off, 1 low latency, 2 low latency + boost. Live.
reflex=1
# Frame cap on the rendered frame rate (0 = off). Through Reflex's frame limiter
# while DLSS-G runs, a sleep limiter in the present path otherwise. Live.
fps_cap=0
