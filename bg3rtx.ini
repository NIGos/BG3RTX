# BG3RTX runtime settings. Re-read automatically while the game runs.

# 1 loads the hot-reloadable core (bin/bg3rtx_core.dll), 0 unloads it.
core=1

# Dump every SPIR-V module the game creates to captures/shaders/<hash>.spv.
# Read at instance creation and on change.
dump_shaders=1

# Compile BG3RTX's own shaders with debug info (for Nsight / RenderDoc).
shader_debug=0

# Flip to 1 (and back to 0) to log the core's pass census.
census_dump=0

# ---- Track A: DLSS Ray Reconstruction (layer/ngx.cpp) ----
# 1 replaces BG3's DLSS SR evaluate with DLSS Ray Reconstruction (guides from
# the G-buffer, shaders/rr_guides.hlsl); 0 leaves the game's SR alone.
# Switches live; the first frame after a switch resets the history.
rr=1
# RR render preset hint for every quality mode: 0 default, 4 D, 5 E.
rr_preset=0
# Debug: replace the upscaled frame with one RR guide (1 diffuse albedo,
# 2 specular albedo, 3 normals, 4 roughness, 5 raw RT0, 6 depth x20).
rr_show=0
# N.V used for the specular albedo guide (EnvBRDFApprox2). The camera is not
# known to the guide pass yet, so it is a constant; <= 0 uses |n.z|.
rr_nov=0.5
# 1 builds the guides at the end of the G-buffer pass (required: the G-buffer
# memory is reused before the DLSS evaluate); 0 builds them at the evaluate
# (debug only, reads garbage). rr_dump_gbuffer=1 adds RT0-RT2 as seen at the
# evaluate to the trace.
rr_guides_at=1
rr_dump_gbuffer=0
# 0 leaves _nvngx.dll unhooked entirely (read when it loads).
ngx_hook=1

# ---- Track C: screen-space GI (docs/TRACK_C_GI.md) ----
gi=1
gi_rays=4
gi_steps=16
gi_radius=0.15
gi_thickness=0.03
gi_strength=1.0
gi_ao=0.7
gi_history=0.1
# 1 GI only, 2 added term x4, 3 visibility, 4 projection check, 5 normals
gi_debug=0

# ---- Track D: geometry capture for hardware RT (docs/TRACK_D_RT.md) ----
# 1 enables VK_EXT_transform_feedback and patches vertex shaders (read at
# device creation: restart the game). Traced frames then write
# captures/<ts>/geo/ (scene.bin, report.json, coverage.png).
geo_capture=0
# G-buffer pass GPU time in the log; geo_xfb_always=1 captures every frame
# into device memory (cost probe only).
geo_timing=0
geo_xfb_always=0

# ---- Track D phase 2: hardware ray tracing on the game's device ----
# 1 enables VK_KHR_acceleration_structure + VK_KHR_ray_query (instance API
# raised to 1.2, transform feedback on): read at instance/device creation,
# restart the game. Every frame the G-buffer geometry is captured and a
# BLAS/TLAS built over it (rt_build=0 pauses that live).
rt=0
rt_build=1
# BLAS refit when the frame's draw sequence matches the last build; a full
# rebuild at least every rt_rebuild_frames. rt_fast_trace=1 builds for trace
# speed instead of build speed.
rt_refit=1
rt_rebuild_frames=60
rt_fast_trace=0
# Ray-traced sun shadows folded into the game's sun shadow mask (in place of
# the screen-space contact shadows, which stay the fallback). Needs rt=1.
rt_shadows=0
rt_strength=1.0
# Ray origin offset along the normal (fraction of camera distance), ray length.
rt_bias=0.002
rt_tmax=300
# Ray-traced ambient visibility in place of the screen-space one (folded into
# the game's AO through the GI path, so it needs gi=1): rays per half-res pixel
# and their length in world units.
rt_ao=0
rt_ao_rays=2
rt_ao_radius=1.0
# 1 traced sun visibility, 2 game sun mask (red) vs traced (green), 3 primary-ray
# check of the TLAS against the depth buffer (green match, red in front,
# blue behind, magenta miss), 4 ambient visibility as folded into the AO.
# Written into the lit diffuse. 1-3 need rt_shadows=1.
rt_debug=0

# DLSS Frame Generation through Streamline (docs/TRACK_B_FG.md).
# 0 = off (Streamline not loaded), 2 = 2x, 3 = 3x, 4 = 4x (multi frame, RTX 50).
# Streamline loads at instance creation, so switching between 0 and 2..4
# needs a restart; 2, 3 and 4 switch while the game runs.
fg=0
