# pixel the water TLAS hit against the bed depth, the wave mesh's geometric normal and one mirror ray
# into the scene, resolved from the screen (tier a) with Schlick E (F0 = 0.16 Reflectance_Base^2).
# Measured, NOT composed: the image does not change (composition is M5.3). Needs rt_water_geometry=1.
# Logs "[water] reflections" / "reflections GPU" every rt_timing_frames. Views over the water:
