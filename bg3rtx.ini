# BG3RTX runtime settings. Re-read automatically while the game runs.
#
# This file is the developer default layer. Layers on top of it, in order
# (docs/USER_SETTINGS.md, common/settings.h):
#   bg3rtx_user.ini  written by bin/BG3RTX.exe (the launcher); may contain
#                    preset=low|medium|high|ultra, which expands to the preset's
#                    keys, then its own keys override them
#   %BG3RTX_INI%     per-run overrides (scripts/auto-run.ps1 -Set ...)
# The keys below equal the High preset. A release package appends
# data/release.ini (developer keys off).

# Developer tools: 1 enables the Ctrl+Shift+F10 trace hotkey (0 in release).
dev=1
# Ctrl+Shift+F9 while playing switches every ray-traced effect off and on (A/B against the
# game's own image; DLSS and frame generation stay as they are). 0 disables the hotkey.
ab_hotkey=1

# 1 loads the hot-reloadable core (bin/bg3rtx_core.dll), 0 unloads it.
core=1

# Dump every SPIR-V module the game creates to captures/shaders/<hash>.spv.
# Read at instance creation and on change. 0 when the key is missing (release).
dump_shaders=1

# Compile BG3RTX's own shaders with debug info (for Nsight / RenderDoc).
shader_debug=0

# Flip to 1 (and back to 0) to log the core's pass census.
census_dump=0

# ---- Track A: DLSS Ray Reconstruction (layer/ngx.cpp) ----
# 1 replaces BG3's DLSS SR evaluate with DLSS Ray Reconstruction (guides from
# the G-buffer, shaders/rr_guides.hlsl); 0 leaves the game's SR alone.
# Switches live; the first frame after a switch resets the history.
rr=1
# RR render preset hint for every quality mode: 0 the snippet's default, 4 D,
# 5 E, 6 F (RR2, "default model" in the 310.9.16 header). Read at RR creation.
# Which nvngx_dlssd loads is logged ("RR snippet loaded"): the game's
# 310.7.129 with fg=0, Streamline's 310.9.16 (bin/sl) with fg>=2.
# A/B on 310.9.16 (docs/TRACK_A_RR.md "Preset"): 0 and 6 give the same cost
# and the same image (default is F), so F is pinned against OTA changes.
rr_preset=6
# RR at the start of post-processing (layer/rrpost.cpp, shaders/rr_post.hlsl,
# docs/TRACK_A_RR.md "RR before post"): RR gets the scene colour before god
# rays, depth of field, exposure, bloom and the PQ 3D-LUT grade, and the game's
# chain is replayed after it at output resolution (DoF weights, exposure,
# bloom and the game's own grade UBO + LUT). 0: RR on the game's graded colour
# (the old path). Frames with a post effect the chain does not model fall back
# to 0 by themselves (logged). Live.
rr_post=1
# Colour-before-transparency guide (the compose output, RR guide 3.4.11);
# rr_post=1 only. Live.
rr_cbt=1
# Truncate the replayed grade input to R11G11B10 like the game's own image, so
# the LUT sees exactly the game's values (bit-exact replication). Live.
rr_post_quantise=1
# A/B only: pass the lighting's pre-exposure s1b13[0] as DLSS.Pre.Exposure. The
# RR guide 3.7 says RR does not support the exposure parameters; the colour
# is eye-adapted already. Live.
rr_pre_exposure=0
# Debug: grade(A * Xr + C) at render resolution every frame (always in traces).
rr_post_check=0
# Debug: RR creation "fails" (tests the non-RR fallback of GI, D-LS, D-RF).
rr_test_fail=0
# Debug: replace the upscaled frame with one RR guide (1 diffuse albedo,
# 2 specular albedo, 3 normals, 4 roughness, 5 raw RT0, 6 depth x20,
# 7 the guides' per-pixel N.V: grey, red where negative).
rr_show=0
# 1: correct guides (docs/TRACK_A_RR.md): world-space normals, per-pixel N.V
# for the specular albedo, and the unjittered WorldToView/ViewToClip matrices,
# all from the G-buffer pass's camera UBO (set 0 binding 2). 0: the old guides
# (view-space normals, constant N.V = rr_nov, no matrices). Switches live.
rr_guides_v2=1
# v1 only: constant N.V for the specular albedo guide; <= 0 uses |n.z|.
rr_nov=0.5
# 1 builds the guides at the end of the G-buffer pass (required: the G-buffer
# memory is reused before the DLSS evaluate); 0 builds them at the evaluate
# (debug only, reads garbage). rr_dump_gbuffer=1 adds RT0-RT2 as seen at the
# evaluate to the trace.
rr_guides_at=1
rr_dump_gbuffer=0
# Debug: traces also write float32 RGBA (.f32, no header) of the RR passes, the
# game's grade output and the tonemapped frame (scripts/rr_post_compare.py).
dump_raw=0
# 0 leaves _nvngx.dll unhooked entirely (read when it loads).
ngx_hook=1

# ---- Track C: screen-space GI (docs/TRACK_C_GI.md) ----
gi=1
gi_rays=4
# Rays per pixel when Ray Reconstruction denoises (full-res path; gi_rays is the
# half-res path without RR).
gi_rr_rays=1
gi_steps=16
gi_radius=0.15
gi_thickness=0.03
gi_strength=1.0
gi_ao=1.0
gi_history=0.1
# 1 GI only, 2 added term x4, 3 visibility, 4 projection check, 5 normals
gi_debug=0

# ---- Track D: geometry capture for hardware RT (docs/TRACK_D_RT.md) ----
# 1 enables VK_EXT_transform_feedback and patches vertex shaders (read at
# device creation: restart the game). Traced frames then write
# captures/<ts>/geo/ (scene.bin, report.json, coverage.png).
geo_capture=0
# G-buffer pass GPU time in the log; geo_xfb_always=1 captures every frame
# into device memory (cost probe only).
geo_timing=0
geo_xfb_always=0

# ---- Track D phase 2: hardware ray tracing on the game's device ----
# 1 enables VK_KHR_acceleration_structure + VK_KHR_ray_query (instance API
# raised to 1.2, transform feedback on): read at instance/device creation,
# restart the game. Every frame the G-buffer geometry is captured and a
# BLAS/TLAS built over it (rt_build=0 pauses that live).
rt=1
# rt_build=auto builds the scene only while a ray-traced effect (or an RT debug
# view) uses it (resolved by the settings layer, common/settings.h); 1 always, 0 never.
rt_build=auto
# BLAS refit when the frame's draw sequence matches the last build; a full
# rebuild at least every rt_rebuild_frames. rt_fast_trace=1 builds for trace
# speed instead of build speed.
rt_refit=1
rt_rebuild_frames=60
# Static/dynamic BVH split (TRACK_D_RT.md 11): instanced static meshes get one
# object-space BLAS each, built once, compacted and cached; the TLAS holds one
# instance per draw instance with the game's own instance matrices; the rest is
# captured per frame with a BLAS per draw, refit while its triangle count holds.
# 0 is the old single soup BLAS (rebuilt whenever the drawn set changes). Live.
# With the split, rt_rebuild_frames paces the per-draw BLAS (staggered) and the TLAS
# refit (rt_tlas_refit=1: refit while the instance list holds).
rt_bvh_split=1   # 2026-10-27: back on; the device lost was D-LS reading a destroyed SSS-profile buffer, not the split (docs/DEVICE_LOST_DLS.md; split 8/8 clean at Campsite after the fix)
rt_tlas_refit=1
# Mesh cache: compaction (rt_mesh_compact), triangles of new meshes built per frame,
# memory budget (pool + BLAS, LRU beyond it) and the audits that recapture cached
# draws and compare (count per frame, interval per mesh; a failure evicts the mesh).
rt_mesh_compact=1
rt_mesh_new_tris=4000000
rt_mesh_budget_mb=2048
rt_mesh_audits=2
rt_mesh_audit_frames=600
rt_fast_trace=0
# Ray-traced sun shadows folded into the game's sun shadow mask (in place of
# the screen-space contact shadows, which stay the fallback). Needs rt=1.
rt_shadows=1
# Screen-space contact shadows, the sun-shadow detail when rt_shadows=0.
contact_shadows=1
rt_strength=1.0
# Secondary-ray origins for every ray-traced pass (sun, AO, GI, D-LS):
# 1 the exact TLAS surface under the pixel, pushed off along its geometric normal
# by Wachter & Binder's float-ULP offset (gi/rt_origin.hlsl; the depth buffer's
# normal where no triangle matches, 2 pixel footprints along the shading normal
# at the shadow terminator); 0 the old offset, rt_bias x camera distance along
# the shading normal. Live.
rt_origin=1
# rt_origin=0 only: offset along the normal (fraction of camera distance). Ray length.
rt_bias=0.002
# 1 traces the sun also for back-lit skin, thin-translucency (foliage) and hair
# pixels, whose transmission reads the sun mask (offset to the side the light comes
# from); 0 zeroes their mask (the old behaviour). Live.
rt_backlit=1
rt_tmax=300
# Soft sun shadows: half-angle of the sun's disc in radians, sampled with 1 ray
# per pixel (RR denoises). 0.00459 is the game's own sun (its specular uses a
# disc of sin = 0.0045900648, 0.263 deg half-angle); 0 = hard shadows.
rt_sun_radius=0.00459
# Experimental current native-cascade sun-only scene. Requires rt_cascade_casters=1.
# Preserves native fallback unless epoch, submission, material and finite-ray
# coverage proofs all pass. No blanket off-screen trust or radius/bias override.
rt_sun_cascade_current=0
# QUALITY R0: the traced sun visibility REPLACES the game's sun mask wherever our BVH
# holds every caster that could shadow the pixel (core/sun_trust.h, TRACK_D 12);
# elsewhere min(game, traced) as with rt_sun_replace=0. Untrusted: the sun ray passes
# through a roof volume of the asset database (rt_sun_roofs: roofed rooms, covered
# floors, roof floors, whose roof the camera may cut away; padded by rt_sun_roof_pad
# sideways and rt_sun_roof_up upwards, metres; rt_sun_roof_mode under them: 0
# min(game, traced), 1 the game's mask, 2 shadow), or it leaves the view frustum
# (+ rt_sun_margin in uv) before rising above the highest visible point +
# rt_sun_top_pad, and at least rt_sun_rise metres (rt_sun_offscreen); trust ramps in
# from rt_sun_ramp of that path. Those are the whole trust (QUALITY R0): nothing
# depends on the game's own mask any more (the proximity term is gone). Without the
# asset database nothing is trusted (unless rt_sun_roofs=0). rt_debug=6 shows the
# trust. qa_zero bit 0 (QA ambient floor) writes a 0 mask with replace on or off.
# All live.
rt_sun_replace=1
rt_sun_roofs=1
rt_sun_roof_mode=0
# NOT DERIVED (R0 open item, TRACK_D 12.4): roof overhang sideways and roof height above
# the trigger top need the roof meshes, which the asset DB does not hold
# (scripts/roof_stats.py: floor triggers touch, gap p50 0.00 m, and reach 22 m (p50)
# beyond their rooms, so triggers cannot tell the overhang).
# 2026-10-29: 50 m up / 3 m sideways (was 3 / 1): with the roof cut away (character at the
# building's edge) sun rays passed above the 3 m volume through the real roof, leaking light
# (S7: 25% of game-dark & RT-lit px brightened, mean +0.044 -> 0.1%, +0.0003).
rt_sun_roof_pad=3.0
rt_sun_roof_up=50.0
# Roof query radius, m. 0 = derived each frame (core/sun_trust.cpp roof_radius): the
# farthest pixel whose trust depends on the roof test (read back from the GPU) +
# rt_tmax, the ray's reach, so every volume a counted sun ray can meet is uploaded
# (nearest first, at most 256; any overflow is logged once per level and counted in
# "sun stats"). Measured (scripts/roof_stats.py): at most 183 roof volumes within
# 600 m of any volume centre in any level (398 in all of CTY_Main_A), so 256 holds up
# to a 600 m radius. > 0: a fixed radius, for experiments only.
rt_sun_roof_radius=0
rt_sun_offscreen=1
# NOT DERIVED (R0 open item): the tallest off-screen caster above the pixel. The asset
# DB has no caster geometry; its FloorTriggers span p50 8.3 m / p95 77 m per building,
# a weak proxy (TRACK_D 12.4 lists the TLAS experiment).
rt_sun_rise=6.0
rt_sun_top_pad=2.0
# 0: the off-screen test only needs rt_sun_rise above the pixel, not the scene top
# (QA 2026-10-27: with the scene top, 94-98% of Campsite's disagreeing pixels fail it).
rt_sun_top=0   # QUALITY R0: only roofs gate the replace; no game-proximity heuristics
rt_sun_margin=0.0
rt_sun_ramp=0.75
# Debug only: splits the rt_debug=7 brightened class into "at the game's shadow edge"
# (lit within rt_sun_near / 2, m) and "farther"; it never changes trust or the mask.
# 0: only the pixel's own mask decides the split.
rt_sun_near=0
# Cascade casters (TRACK_D 6.7 item 2, off by default): the game's sun shadow cascade
# rt_cascade_index (0 nearest; the passes are D16 2048x2048 layers, FRAME_MAP 10) is captured
# by transform feedback too, minus the draws the camera pass also drew, and goes into the
# NEXT frame's TLAS as its own instance (mask 0x02, rebased by the camera move). It holds
# what the camera does not draw: cut-away roofs, off-screen walls. Only the sun traces it;
# GI, reflections, local lights and primary checks trace mask 0x01. rt_cascade_mb: XFB
# memory per frame (two such buffers). rt_cascade_roofs_trust=1: with the casters on, roof
# volumes no longer stop the RT sun from replacing the game's mask. All live; the layer
# code needs one game restart after building it. Log: [cascade] lines, "sun stats".
rt_cascade_casters=0
rt_cascade_index=2
rt_cascade_mb=160
# rt_cascade_roofs_trust=0 (default): the roof volumes stay (the game's mask under roofs) and
# the cascade casters only add occluders. 1 dropped the roof volumes: inside the inn the sun
# then came in through windows whose shutters/glass are alpha-tested casters (skipped):
# sup-trust-inn-fg2 interior leak 4.5% of px (trust 1) vs 0.14% (trust 0; casters off 0.12%).
rt_cascade_roofs_trust=0
# rt_cascade_origin=1: the cascade soup is relative to the cascade UBO's own origin (byte 208,
# 92 m from the camera's in S7: the first test placed it there and the roofs leaked);
# 0 = relative to the previous frame's camera (first version, for A/B only).
# rt_cascade_index=2 (41 m wide in S7; cascade 1 is 20 m, too small for a building).
rt_cascade_origin=1
# rt_cascade_alpha=1: alpha-tested cascade draws go in as opaque (their cutouts turn solid);
# 0 (default) skips them. Inn, view over the roof (sup-floor2): with 1 the RT sun darkened
# 17.5% of the pixels the game has in sun (solid tree and vine cards), with 0 2.7%
# (casters off 2.6%). 2 (default): only texture cutouts (FS in the alpha table) are skipped;
# discarding FS without a texture alpha (LOD dither, camera fade) go in solid. sup-dither-*:
# outdoor false darkening 2.7-2.9% (casters off 2.8%); interior leak with trust 1 4.7% -> 2.0%.
rt_cascade_alpha=2
# rt_cascade_alpha_dedupe=1: an alpha-tested cascade draw whose mesh the camera pass also drew
# is skipped (the camera copy has the real alpha test; the solid cascade copy gave polygonal
# leaf shadows). Off-screen and cut-away alpha-tested casters stay (solid).
rt_cascade_alpha_dedupe=1
# rt_cascade_refit=1: when the cascade draw list is unchanged (same draws, order and triangle
# counts) the cascade BLAS is refitted instead of rebuilt, a full build every
# rt_cascade_rebuild_frames frames. Live. Default 1: inn static scene build 2.95 -> 1.7 ms (casters off
# level), sun dark/leak identical (2.72 vs 2.73%, leak 0); rotating: no change in either.
rt_cascade_refit=1
rt_cascade_rebuild_frames=60
# Ray-traced ambient visibility in place of the screen-space one (folded into
# the game's AO through the GI path, so it needs gi=1): rays per half-res pixel
# and their length in world units.
rt_ao=0
rt_ao_rays=2
rt_ao_radius=1.0
# 1 traced sun visibility, 2 game sun mask (red) vs traced (green), 3 primary-ray
# check of the TLAS against the depth buffer (green match, red in front,
# blue behind, magenta miss; same surface within the derived depth_tol + the
# measured 0.5% TLAS error), 4 ambient visibility as folded into the AO,
# 8 QA view of the TLAS in front of the depth buffer (scripts/qa tlas_front),
# 6 rt_sun_replace trust (red roof volume, blue off-screen fallback, green trusted),
# 7 rt_sun_replace in-frame A/B (written mask brighter than min(game, traced) by at
# least one R8 code, 1/255, the smallest step the R8 mask can hold: yellow at the
# game's shadow edge, red farther (rt_sun_near); blue darker by >= 1/255). 2 also
# shows the visibility written into the mask in blue. Written into the lit diffuse.
# 1-3, 5-7 need rt_shadows=1.
rt_debug=0
# GPU counters for the debug views and the hybrid GI, logged as "rt stats"
# (costs ~2 ms; measurements only).
rt_stats=0
# Positive serial: capture 16 consecutive lighting frames, once per serial.
pan_capture=0
pan_prepare=0
; Include actual RR inputs and FG composite inputs in a pan burst (diagnostic).
pan_inputs=0
; Preserve the coherent NGX depth/MV pair for FG and track event-wait layouts.
fg_input_copy=1
# QA only (docs/QA.md, hard_dark energy bound): the light-off traces. Bit 0 writes the sun
# mask 0 (no direct sun), bit 1 local-light visibility 0, bit 2 the AO 0 (no diffuse
# ambient). The image then holds everything but that light: the floor an effect that only
# removes that light cannot go below. Never set in play.
qa_zero=0
# QA only (docs/QA.md "Exposure hold"): 1 freezes the game's eye adaptation at the exposure
# in use when it is switched on (layer/rrpost.cpp; needs rr=1 and rr_post=1), so every trace of
# a QA run has one exposure. Never set in play.
qa_exposure_hold=0
# QA only (live): cap on the alpha-tested candidates of every ray query; a query over it is
# aborted and "unknown" (sun / D-LS keep the game's term, D-RF keeps the probe, RT AO counts
# it occluded). 0 = the built-in 4096; 1-4 force aborts in foliage to test those fallbacks
# (rt_debug=6 yellow, rf_debug=1 yellow, "[core] guard:" unknown counts). Never set in play.
rt_max_candidates=0

# ---- D-EM: emissive geometry (docs/TRACK_D_RT.md section 12) ----
# Captures the game's emissive draws (its effects target, before the lighting) into a
# TLAS of their own with a record per draw (radiance, mask texture), and builds a light
# list (triangles with area, radiance, power) per game submission of the effects passes,
# in a command buffer of its own. Data only: no effect uses it yet. Live; needs rt=1
# (not rt_bvh_split: the emissive scene keeps no cached meshes). Enabling requires restart;
# default-off initialization allocates no emissive scene. An enabled process can stop capture live.
rt_emissive=0
# Diagnostic only: count coincident same-family draws, leave nearest-hit shading unchanged.
rt_em_overlap_check=0
# Light list size (allocated at device creation; triangles past it are counted, left out).
rt_em_max_lights=65536
# Emissive soup (XFB of the emissive draws, a ring): its first size, grown to three frames'
# demand at a build (up to rt_em_xfb_max_mb; logged "[em] emissive soup grown").
rt_em_xfb_mb=32
rt_em_xfb_max_mb=512
# Calibration of the families whose formula is approximate (lava, vertex-colour tiles): the
# projected check runs without a view every rt_em_check_frames frames, and their radiance
# is scaled by game/ours (damped). Exact families are never scaled. 0: off.
rt_em_calib=1
rt_em_check_frames=16
# FLUID_Lava_Plane_Flowmap: the heat h (0-1) at which its blackbody LUT is read.
rt_em_lava_heat=0.5
# 1: one "[em]" line per build (draws, triangles, lights, total power).
rt_em_log=0
# Debug views (rt_debug, written into the lit diffuse; need rt=1 and a scene build):
# D-EM views:
#   16 the emission our data gives at each primary hit (compose then adds the game's own
#     effects target: emissive surfaces show about twice as bright where both agree);
#   17 black: the final image shows the game's effects target alone (the reference for 16);
#   18 ratio ours/game: green within 25%, red ours brighter, blue darker, yellow ours only,
#     magenta the game's only. All three log "[em] projected check" per rt_timing_frames.
#   19 / 20 one family alone (rt_em_dbg_fam_hi/_lo: the top 32 bits of its FS hash as two
#     16-bit decimals): ours (19) or the game's effects target (20) at its hits, black elsewhere.
rt_em_dbg_fam_hi=0
rt_em_dbg_fam_lo=0
# rt_em_tol: depth agreement of a visible emissive hit; rt_em_fx_thr: effects-target
# luminance counted as emission.
rt_em_tol=0.01
# Test of the glow maps' filtering (TRACK_D 13.16; live): 0 the ray-cone LOD; 1 the game's
# isotropic LOD from screen-space UV derivatives; 2 anisotropic, up to rt_em_aniso probes.
rt_em_filter=0
rt_em_aniso=16
rt_em_fx_thr=0.05
# Measurements: rt_em_backdrop=1 also captures the skydome backdrops (their share of the
# effects target in the projected check); rt_em_lights=0 skips the light list.
rt_em_backdrop=0
# Emissive deferred decals (their projection box, flagged approximate and calibrated): 0 leaves them out.
rt_em_decal=1

# ---- Track D phase 3 (docs/TRACK_D_RT.md section 7) ----
# 1 builds the scene from the depth prepass with UVs (XFB stride 24) and
# alpha-tests cutout draws in every ray query (table: shaders/rt/alpha_fs.txt,
# from scripts/alpha_table.py). Read at device creation: restart. Needs rt=1.
rt_alpha=1
# rt_prepass_by_ordinal=0: the RT scene comes from the first big depth-only pass of each frame on
# the G-buffer depth. 1 = the old learned position in the command buffer (fragile: small passes
# before it come and go with in-world UI, which froze the RT scene for 8 frames). Restart.
rt_prepass_by_ordinal=0
# Live A/B switch: 0 makes the alpha-tested geometry opaque again.
rt_alpha_test=1
# How a ray hit on a cutout is tested (live; docs/TRACK_D_RT.md 7.1):
#   rt_alpha_cut=1 the shader's effective cut-off (0.5 where its first discard is
#     an early-out at 0.001/0.01, e.g. grass); 0 the first test's (cards turn solid);
#   rt_alpha_stochastic=1 a hashed threshold where the alpha read is blurred
#     (ray-cone footprint above ~2 texels): coverage kept unbiased under RR;
#   rt_alpha_unknown=1 a cutout whose alpha cannot be read lets GI/AO/reflection
#     rays through (shadow rays still stop); 0 solid for every ray.
rt_alpha_cut=1
rt_alpha_stochastic=1
# Opt-in native CHAR_Scalp hard coverage (material smoothstep/root, RT cone LOD).
# Camera depth uses original Frame phase, projection and viewport dither;
# physical shadow/GI/reflection queries retain native Shadow hard coverage.
# Not full hair coverage or cascade alpha. Capable shaders stay loaded after off
# until restart so held/retired scene records keep their original interpretation.
rt_native_scalp=0
# Experimental EXT four-state opacity micromap backend (restart required).
# Native alpha certification and same-run GPU traversal gates are still required.
# Unsupported devices retain ordinary RT. Never force UNKNOWN to two-state.
rt_omm=0
# Native CHAR_Hair and verified static CHAR_Pubes strand coverage; restart.
# Opt-in 88-byte XFB stream and procedural primary depth. Live depth gate pending.
rt_native_hair=0
# Reserve physical Hair secondary-origin data at startup; then 0/1 is a live A/B.
# Keeps native virtual depth for primary/history tests. Experimental, cost pending.
rt_hair_physical_origin=0
rt_alpha_unknown=1
# Alpha-tested part of the RT capture buffer (rt_xfb_mb, 384 MB): rt_alpha_mb at
# first and as the minimum; rt_alpha_auto=1 then sizes it at 1.5x the previous
# frame's demand (grown at once, shrunk below a third), capped at rt_alpha_max_pct
# of the buffer and by the opaque triangles' own demand. A full region turns
# alpha-tested draws opaque: logged as "[geo] WARNING", as is any draw left out.
rt_alpha_auto=1
rt_alpha_max_pct=60
# Triangle strips and fans go into the RT scene too (exact size: non-indexed, or
# indexed without primitive restart). Indirect draws cannot be sized and are
# counted in the "[geo] RT capture" log line.
rt_strips=1
# 5 = primary-ray check with errors coloured by origin (needs rt_shadows=1).
# Hybrid GI: the GI trace uses ray queries against the TLAS (needs rt=1, gi=1;
# replaces the screen-space trace and rt_ao). Hits on screen take last frame's
# radiance; hidden/off-screen hits: 0 occlude only, 1 ignore, 2 occlude + mean
# on-screen radiance.
gi_rt=1
gi_rt_radius=1.0
# A hit is "on screen" when the depth there is the hit itself, within a tolerance derived
# from the pixel footprint, the surface slope, the jitter and the depth precision
# (shaders/rt/depth_tol.hlsli; replaces the fixed 3% gi_rt_depth_tol). gi_rt_depth_k
# multiplies it: 1 as derived (keep it there), > 1 / < 1 only for A/B checks. Live.
gi_rt_depth_k=1.0
gi_rt_fallback=0
# Bounce source (QUALITY R3): 0 the diffuse part of last frame's radiance only (view
# independent); 1 diffuse + the specular the camera saw (old; its sun glints are
# sparse, very bright 1-spp hits). Reflections always read both.
gi_bounce_spec=0

# ---- SHaRC radiance cache, v1: screen-injected (docs/DESIGN_SOTA_NEXT.md item 2) ----
# 1: a world-space hash grid (NVIDIA SHaRC 1.8.3, external/sharc-1.8.3) fed every frame with
# the game's lit diffuse of visible pixels (+ the D-EM emission when that branch is built);
# GI rays at hidden/off-screen hits and the glossy reflection fallbacks read it, and the GI
# rays reach sharc_gi_radius instead of gi_rt_radius. Needs rt=1, gi=1, gi_rt=1. Live. Off
# until it passes QA (roofed_brightening, docs/QA.md).
sharc=0
# Entries: 2^sharc_log2 (16-24). 22 = 160 MiB (hash keys 32 + accumulation 64 + resolved 64),
# 21 = 80 MiB. Reallocated (and cleared) on change.
sharc_log2=22
# 1 pixel per stride x stride block is injected per frame (position randomised).
sharc_inject_stride=2
# Accumulation cap (frames of lag) and eviction after this many frames without a sample.
sharc_frames=16
sharc_stale=128
# Voxel size: HashGridParameters sceneScale (voxel = 2^level / scale, level = log_base of the
# camera distance + level bias); the SDK's defaults for log base and bias.
sharc_scene_scale=50
sharc_log_base=2
sharc_level_bias=0
# Bits: 1 GI hidden hits, 2 GI off-screen hits, 4 reflections (roughness >= sharc_rf_rough and
# a ray cone at least sharc_rf_cone voxels wide at the hit).
sharc_query=7
# 4 m: Campsite GI trace 0.54 -> 0.87 ms (8 m: 1.00 ms), cache found for 37% of the non-screen hits (8 m: 30%).
sharc_gi_radius=4
sharc_rf_rough=0.2
sharc_rf_cone=1
# Hits nearer than this many voxels keep the gi_rt_fallback rule (SHaRC's segment rule).
sharc_near=1
# Weight of the D-EM effects-target emission in the injection (0 off; needs D-EM).
sharc_em=1
# A camera jump of more than this (m) in one frame clears the cache (teleport, level load).
sharc_reset_jump=50
# Leak mechanism of the cache (a cell straddling a wall carries the far side's light): a cache
# hit whose cell, projected into the hit surface's plane, is not visible from the hit point is
# not used (1 ray per cache hit). sharc_leak_check=1 measures it (also a ray into the surface:
# a slab thinner than the cell) for "sharc stats" and view 6, whether or not it rejects.
sharc_reject_occluded=1
sharc_leak_check=0
# QA diagnostic: also inject into a reference grid with cells sharc_fine_scale times smaller and,
# per cache hit, log coarse minus fine radiance ("fine-cell reference"): the cache's leak bias
# against its own leak-free limit. Static camera only; adds inserts (about 16x the entries).
sharc_fine_check=0
sharc_fine_scale=4
# 1 voxel hash colours, 2 table occupancy, 3 cached radiance at the pixel's surface,
# 4 GI ray tiers (red cache, green screen, blue fallback), 5 QA roof mask (green roofed),
# 6 the cache's GI contribution by leak test (red occluded cell, green clean, blue thin).
sharc_debug=0
# 1: "sharc stats" log lines every 300 frames (occupancy, injection, query hit rates).
sharc_stats=0
# Frames per "sharc stats" window (the QA uses 60 so a window fits inside one phase).
sharc_stats_frames=300
# Restart: the layer enables 64-bit integer atomics, float16 and 16-bit storage on the game's
# device (only where supported, logged "[rt] SHaRC device features"). 0 leaves them off.
sharc_device=1

# ---- D-LS: ray-traced shadows for BG3's local point/spot lights (TRACK_D_RT.md 9) ----
# 1 re-evaluates every point/spot light the tiled lighting applied (its own
# light list, froxels and BRDF) and adds c * (traced visibility - game shadow)
# into the lit diffuse/specular, so lights without a shadow map stop leaking
# through walls and floors. Needs rt=1. Live. About 0.4 ms in the foundry (TRACK_D 9.9).
rt_local_shadows=1
# Lights that have a game shadow map: 0 keep the game's atlas, 1 replace it with the
# traced visibility, 2 min of both, 3 (default, QUALITY R0) replace it where the segment
# surface -> light lies in the view frustum (all its casters are in the BVH), min of both
# elsewhere (the atlas has the off-screen casters). Live; cost in TRACK_D 9.10.
ls_shadowed=3
# Soft shadows: light sphere radius (world units), sampled 1 ray per light with
# RR (ls_soft=-1 follows whether RR actually runs, not the rr key; without a denoiser the ray goes to the centre).
ls_source_radius=0.05
ls_soft=-1
# Rays stop this far short of the light (its own lamp/sconce geometry).
ls_clear=0.2
# Unshadowed lights with a smaller range (world units) are left alone.
ls_min_radius=0
# 0 one ray per light and pixel; 1-2 rays per pixel to lights chosen by RIS.
ls_samples=0
# Exact-k + RIS remainder (DESIGN_SOTA_NEXT 1a, TRACK_D_RT.md 9.11; with ls_samples=0 and
# ls_debug=0): the ls_k (1-4) strongest traced lights per pixel get their own ray, and
# ls_rest_samples (1-2) rays go to the others, picked in proportion to their exact unshadowed
# contribution and weighted by 1/probability. Unbiased; at most ls_k + ls_rest_samples rays
# per pixel. ls_k=0 (default; 9.11: k1 -22% in Grymforge, still over budget) traces every light;
# ls_rest_samples=0 drops the rest (biased, debug only). Live.
ls_k=0
ls_rest_samples=1
ls_strength=1.0
# 1 lights per pixel (red unshadowed, green shadowed; 1.0 = 8), 2 light removed x4,
# 3 traced visibility, 4 validation |game - recomputed| x4 (zeroes AO and sun mask),
# 5 recomputed direct local light (same zeroing). ls_stats=1 logs "ls stats".
ls_debug=0
ls_stats=0
# Experimental directional lights inside oriented boxes. Off until S6/S7/S5
# recompute, shadow and temporal gates pass. Uses the native lighting descriptor
# set; ls_check and ls_impl=0 keep the point/spot reference path.
ls_box=0
# ls_box_unshadowed=1: box lights the game draws without a shadow map get RT shadows too (most
# of them; the main-menu skull loses its beam to decorative casters inside the box). 0: only
# the box lights with a game shadow map are traced (default: the artist's choice of an
# unshadowed light is kept). Live.
ls_box_unshadowed=0
# Startup-only QA: recognized native shader controls, debug4/5, not production.
ls_native_direct_validate=0
# ls_debug=7: the validation of ls_debug=4 with the sun kept (checks the sun
# recompute of rt/bg3_sun.hlsli used by ao_direct). ls_debug=9: the evaluated
# lights by owner (red unmatched, white placed, orange item, green scenery,
# magenta character, cyan unknown visual light).
# Per-light data (docs/SE_BRIDGE.md, TRACK_D_RT.md 9.8): 1 joins each light of the
# lighting's array to the runtime lights (Script Extender bridge + asset database)
# for its source radius (fixture class) and owner. 0: ls_source_radius for every light.
ls_lights=1
# Owners whose lights get traced shadows, bit per owner: 1 unknown visual light,
# 2 placed, 4 item, 8 scenery, 16 character. 31 (default): the owner is no reason to skip
# a light (15 was the old rule that left every character light unshadowed).
ls_owners=31
# Art intent: lights whose game template sets neither Shadow nor CastShadow and that are
# 0 never skipped, 1 (default) skipped when they are the darkvision light that follows the
# active character (a readability aid, Light_Player_Darkvision_*), 2 always skipped (strict;
# that is 98% of BG3's placed point lights, so their leaks through walls would return).
ls_noshadow=1
# 1: the AO-on-direct give-back (ao_direct) is bounded per channel by what the game's pixel
# implies (never binds when the recomputed sun is right; the S6 green walls). 0 for A/B.
ls_giveback_cap=1
# Runtime lights uploaded within this distance of the camera (world units).
ls_lights_radius=80
# Join tolerances (docs/SE_BRIDGE.md "Join tolerances", derived in core/ls_lights.cpp, logged
# on the "ls: per-light data" line). Lights that stay put: float precision at their position
# and the export's rounding (0.5 mm at Campsite, 7 mm at 8.5 km). Lights the bridge reports
# that move (character, item, visual lights such as carried weapons' VFX lights): + this
# carrier speed (m/s) x the measured age of the export when it is last used (export interval
# + its age at arrival + 2 frames, about 0.5 s): ~4 m. 8 = the MovementSpeedSprint/Dash most
# root templates set; "[se] motion" logs the fastest moving light the bridge saw. Unmatched
# lights lose their fixture radius. (It replaces ls_dyn_tol=1.5 and the fixed 4 m of
# character lights.)
ls_dyn_speed=8
# A/B against the frozen pre-optimisation pass (shaders/gi/ls_ref): ls_impl=0 runs it.
# ls_check=1 runs it and the live pass on the same pixels and logs "ls check" (pixels
# whose outputs differ in any bit: 0); 2 the reference against itself (the check's floor).
ls_impl=1
ls_check=0

# ---- Script Extender bridge (docs/SE_BRIDGE.md) ----
# 1 reads the BG3RTX_Bridge mod's exports (scripts/install-se-bridge.ps1) from
# %LOCALAPPDATA%\Larian Studios\Baldur's Gate 3\Script Extender\bg3rtx. Live.
se_bridge=1
# An export older than se_stale_periods x the export interval (the longest of the last 16,
# at least 250 ms) + the reader's 100 ms poll counts as no bridge (database only): 4 lets 3
# exports in a row go missing (about 1.1-1.5 s; it was a fixed 3000 ms). se_stale_ms > 0
# replaces the derived limit with a fixed one (ms).
se_stale_periods=4
se_stale_ms=0

# ---- RT audit fixes (docs/AUDIT_RT.md) ----
# Material classes (RT2.a bits 0-2, RT3; docs/FRAME_MAP.md): D-LS evaluates each
# light with the class's own BRDF (skin with diffuse colour 1 and transmission,
# anisotropic, hair, cloth sheen; unlit pixels untouched), and the GI composite adds
# the bounce with the class's diffuse colour (none on unlit, white on skin). 0: all
# pixels as class 0 (the old behaviour). Live.
mat_classes=1
# AO on direct light. The game multiplies direct sun and local light by
# mix(1, AO, 0.5), and with the GI fold that AO is our 1-ray RT visibility.
# 1 (default) no AO on lights whose shadow is ray traced (D-LS lights, the sun with
#   rt_shadows): exact compensation in the D-LS pass, the sun recomputed
#   (rt/bg3_sun.hlsli); their RT shadow is the occlusion, no contact is darkened twice;
# 2 the game's own factor with its own SSAO on those lights (the original look);
# 0 leave it (direct light darkened by the noisy RT visibility, contacts twice).
# Needs rt_local_shadows=1 (the pass that does it). Live.
ao_direct=1

# ---- D-RF: ray-traced reflections (TRACK_D_RT.md 10) ----
# 1 traces one reflection ray per pixel and replaces the game's specular probe term
# (recomputed exactly from the lighting's own probes, DFG LUT and occlusion) by
# what the ray sees where its hit is on screen: b11 += w * (L_hit * EnvBRDF - probe).
# Misses and off-screen/hidden hits keep the game's probe. Needs rt=1 and gi=1
# (last frame's radiance). Live. About 0.33 ms in the foundry.
rt_reflections=1
# Reflections fade to the probe between 0.75x and 1x of this roughness. With RR,
# GGX VNDF samples (rf_rr=-1 follows whether RR actually runs; mirror below rf_mirror_rough); without
# RR (no denoiser) mirror rays only, up to rf_max_rough_norr.
rf_max_rough=0.6
rf_max_rough_norr=0.3
rf_mirror_rough=0.1
rf_rr=-1
# Ray length (world units), the multiplier on the derived depth agreement of an
# on-screen hit (1, as gi_rt_depth_k; replaces rf_depth_tol=0.03), screen-edge fade (uv).
rf_tmax=100
rf_depth_k=1.0
rf_edge=0.05
rf_strength=1.0
# 1 also applies the game's specular occlusion to traced hits (the ray already
# finds the occluder, so 0). Shading models (RT2.w & 7) that get reflections: bit mask.
rf_so=0
rf_models=3
# 1 tier per pixel (green on-screen hit, red hidden, orange off screen, blue miss,
# magenta below horizon, grey not traced), 2 specular change x4 (green added, red
# removed), 3 the game's probe term as recomputed, 4 the probe term after D-RF,
# 5 validation residual x4 (with rf_validate=1), 6 hit distance / 10.
# rf_stats=1 logs "rf stats"; rf_validate=1 (with rf_stats=1) runs the lighting
# with AO 1 and no sun and logs "rf validation" (game vs recomputed specular).
rf_debug=0
rf_stats=0
rf_validate=0
# RR gets the reflection rays' hit distance (DLSSD.SpecularHitDistance).
rr_spec_hit_distance=1

# DLSS Frame Generation through Streamline (docs/TRACK_B_FG.md).
# 0 = off (Streamline not loaded), 2 = 2x, 3 = 3x, 4 = 4x (multi frame, RTX 50).
# Streamline loads at instance creation, so switching between 0 and 2..4
# needs a restart; 2, 3 and 4 switch while the game runs.
fg=2
# NVIDIA Reflex: 0 off, 1 low latency, 2 low latency + boost. Live.
reflex=1
# Frame cap on the rendered frame rate (0 = off). Through Reflex's frame limiter
# while DLSS-G runs, a sleep limiter in the present path otherwise. Live.
fps_cap=0
# BG3 Script Extender: it Detours-patches this layer's vkQueuePresentKHR and
# swapchain entry points for its ImGui overlay, which stops DLSS-G from showing
# generated frames. 1 puts our original code back when the patch leads into the
# Script Extender (its overlay stays off, scripting is unaffected), 2 for any
# module, 0 only logs it. Checked at vkGetDeviceQueue and every 64 presents.
se_unhook=1
rt_scene_camera_match=0
# Translate lighting-space ray origins into the selected TLAS's camera space.
rt_scene_rebase=0
# Diagnostic: log the record/submit order of scene build and RT passes for N frames every 600.
rt_order_trace=0
# P1 (default on since 2026-10-29): the RT passes wait (at most rt_scene_wait_ms) for this frame's scene build, so they trace
# the same frame as the G-buffer instead of the previous one.
rt_scene_wait=1
# Log the CPU time of the geometry-capture hooks every 300 frames ([cpu] lines).
cpu_timing=0
# Read alpha material constants with aligned streaming loads (live A/B). Default 1: capture hooks 4.22 -> 2.97 ms CPU/frame (sup-perf-matrix), primary match 98.969 vs 98.968% (identical output).
rt_alpha_stream=1
# Log every TLAS content change while the camera is static ([bvh] static-camera change).
rt_stability_log=0
# Camera-source pipeline state diagnostic (per rt_timing_frames window).
rt_capture_state_log=0
# Draw identity and submit-time first transform: 1 uses rt_timing_frames, N > 1 samples every N frames.
rt_mesh_draw_log=0
# Diagnostic: capture all draws instead of reusing cached object-space meshes (live).
rt_mesh_capture=0
# Exclude known depth-write-disabled camera draws from RT (dynamic/unknown kept).
rt_capture_depth_write=0
# Exclude fragment entry points proven to unconditionally discard (live).
rt_capture_discard=1
# Static-camera captured-draw retention, in frames (0 off, max 120). Cleared on camera movement.
rt_dyn_hold=4
# Only draws up to this many triangles are snapshotted for the hold (LOD props; terrain is excluded).
rt_dyn_hold_max_prims=8192
# 12: inn jobs wait up to 9.5-10 ms (mean 4.6-4.9); 8 timed out on 1% of frames.
rt_scene_wait_ms=12
rt_primary_check=0
# Same primary query with GPU camera-epoch and pool/soup classification statistics.
rt_primary_epoch=0
# Diagnostic capture: primary Y/Z store TLAS instance index bytes instead of distance/tolerance.
rt_primary_identity=0
# First fatal exception minidump for unattended tests, independent of FG.
crash_dump=0
# Reset FG stability only when a current input image is destroyed, not a retired tag.
fg_current_destroy_only=1
# DLSS-G tags of the game's UI composite (layer/streamline.cpp). With HDR10 output the game
# composites its sRGB UI (scaled by paper white) over the PQ scene; the raw UI image tagged as
# UIColorAndAlpha does not match that, so the UI on generated frames differs from the real
# ones (suspected cause of the flicker around in-world UI with FG on, also with RT off).
# fg_tag_ui=0 tags only the hudless image (DLSS-G then finds the UI by difference). Live.
fg_tag_hudless=1
fg_tag_ui=1
# fg_ui_pq=1: tag our own UI image instead, ui' = final - hudless * (1 - a) with the game's
# alpha (shaders/fg/fg_ui_pq.hlsl): DLSS-G's ui + frame * (1 - a) then gives the game's exact
# HDR10 composite on real frames. A persistent image (no UI tag churn). Live.
fg_ui_pq=0
