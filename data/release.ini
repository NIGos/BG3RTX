dump_shaders=0
shader_debug=0
census_dump=0
geo_capture=0
geo_timing=0
rr_show=0
rr_dump_gbuffer=0
gi_debug=0
rt_debug=0
rt_stats=0
ls_debug=0
ls_stats=0
ls_native_direct_validate=0
rf_debug=0
rf_stats=0
rf_validate=0
rr_post_check=0
dump_raw=0
rr_test_fail=0
rt_em_overlap_check=0
# Diagnostics bg3rtx.ini already has at 0, pinned off here so a developer edit of
# bg3rtx.ini cannot ship them (docs/RELEASE_CHECK_20261101.md). rt_primary_check
# with rt_stats costs ~80 ms/frame.
rt_primary_check=0
rt_primary_epoch=0
rt_primary_identity=0
rt_primary_fade_class=0
cpu_timing=0
crash_dump=0
pan_capture=0
