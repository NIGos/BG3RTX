# BG3RTX user settings, written by BG3RTX.exe. Layered over bg3rtx.ini:
# the preset's keys apply first, then every key below. Re-read while the game runs.
# See docs/USER_SETTINGS.md.
preset=ultra

# Changed from the preset
# Box light shadows
ls_box=2
# Preserve cutout capture on overflow
rt_alpha_spill=1
# Native hit materials
rt_hit_material=1
# Native hit materials: wind and two-sided foliage
rt_hit_material_instanced=1
# Shaded hidden-surface bounce
gi_hit_direct=1
# Sunlit hidden-surface bounce
gi_hit_sun=1
# Shaded hidden-surface reflections
rf_hit_shade=1
# Emission at ray hits
rt_hit_emission=1
# Water geometry capture
rt_water_geometry=1
# Water reflections (measured)
rt_water_reflections=1
# Water reflections (composed)
rt_water_compose=1
# Water sun shadows
rt_water_shadows=1
# Water local-light shadows
rt_water_ls_shadows=1
# Water refraction
rt_water_refraction=1

# Other keys (kept as written)
rt_emissive=1
rt_debug=0
rt_xfb_mb=1024
rt_cascade_mb=427
